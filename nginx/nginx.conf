# =====================================================================
# 文件名: nginx/nginx.conf
# 用途:   「AI 厨娘」容器栈 nginx 站点配置（web 服务镜像内的 default.conf）
#         - location /        → web-stage1 dist（SPA history 回退 index.html）
#         - location /admin/  → admin-web dist（SPA history 回退 /admin/index.html；
#           构建期 --base=/admin/，静态资源路径为 /admin/assets/*）
#         - location /v1/ /api/ /admin/v1/ → proxy_pass http://api:8000
#           （X-Request-Id 透传：客户端携带时原样转发，后端中间件复用同一幂等键）
# 说明:   proxy_set_header 写在 server 级，对所有反代 location 统一生效；
#         /admin/v1/ 与 /admin/ 前缀重叠，nginx 按最长前缀匹配，互不干扰。
# =====================================================================

server {
    listen 80;
    server_name _;

    # 上传体积上限（模块 D 拍照识别图片）
    client_max_body_size 10m;

    # ---- 反代公共头（server 级，被 /v1/ /api/ /admin/v1/ 继承） ----
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # X-Request-Id 透传（客户端未携带时后端中间件自行生成）
    proxy_set_header X-Request-Id $http_x_request_id;
    # 推荐/创新链等编排接口耗时可达数秒，放宽读超时
    proxy_read_timeout 65s;
    proxy_connect_timeout 5s;

    # docker 内嵌 DNS（容器网关 127.0.0.11）：upstream 用变量延迟到运行时解析，
    # 避免 nginx 启动瞬间 compose 网络尚未就绪导致 "host not found in upstream" emerg 退出
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 用户端 SPA（web-stage1，base=/） ----
    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- 管理后台 SPA（admin-web，base=/admin/） ----
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 后端 API 反代（业务 /v1、健康兼容 /api/health、后台 /admin/v1） ----
    location /v1/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location /admin/v1/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }
}
