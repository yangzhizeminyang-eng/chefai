# =====================================================================
# 文件名: docker-compose.yml（项目根）
# 用途:   「AI 厨娘」15 模块全量容器栈：db(pgvector) + api(FastAPI) + web(nginx 双前端) + redis(预留)
#
# 启动步骤（Windows PowerShell，需先安装并启动 Docker Desktop）：
#   1) 一键拉起（等待 api 健康检查就绪并输出访问地址）：
#      powershell -ExecutionPolicy Bypass -File scripts\manage.ps1 -Action docker -DockerCmd up
#      等价于：docker compose -f docker-compose.yml up -d
#   2) 首次启动初始化种子数据（幂等，含食材/菜谱/风控规则/管理员 admin）：
#      docker compose exec api python -m app.seed
#   3) 冒烟验证：powershell -ExecutionPolicy Bypass -File scripts\manage.ps1 -Action smoke
#   4) 访问地址（默认 80，若宿主机 80 被占用则以 WEB_PORT=8080 up，地址相应变为 :8080）：
#      用户端   http://localhost/          （web-stage1 dist）
#      管理后台 http://localhost/admin/    （admin-web dist，账号 admin，口令由 ADMIN_PASSWORD 配置）
#      后端 API http://localhost/v1/healthz（亦发布 8000 直连 http://127.0.0.1:8000）
#   5) 停止：docker compose down（数据保留在命名卷 pgdata / uploads，down 不删卷）
#
# 注意：
#   - db 未向宿主机发布 5432，避免与本机开发 PostgreSQL 端口冲突；
#     排查可执行：docker compose exec db psql -U postgres -d aicook
#   - api 的连接参数经 environment 注入（DB_HOST=db 覆盖 env_file 中的 localhost，
#     compose 中 environment 优先级高于 env_file）；backend/.env 透传 LLM 配置。
#   - redis 为阶段二预留（后端当前进程内缓存，不强依赖），未发布宿主机端口。
# =====================================================================

services:

  # ---------- 数据库：pgvector 镜像（迁移中 CREATE EXTENSION vector 可直接成功） ----------
  # 镜像走 docker.m.daocloud.io 加速前缀（当前网络直连 Docker Hub 被劫持）；
  # 如需官方源改回 pgvector/pgvector:pg16、redis:7-alpine 即可
  db:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: aicook-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-aicook_dev_only}"
      POSTGRES_DB: aicook          # 首次启动自动建库，满足 api 内 alembic upgrade head 前置条件
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicook"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---------- 后端：FastAPI（启动即 alembic upgrade head，再 uvicorn 8000） ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicook-api
    env_file:
      - ./backend/.env             # 透传 LLM_BASE_URL/LLM_API_KEY/LLM_MODEL 等（可选项）
    environment:
      # 容器内连接串：服务名 db（environment 优先级高于 env_file）
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "${DB_PASSWORD:-aicook_dev_only}"
      DB_NAME: aicook
      # 以下缺省值仅供本地开发；生产由 docker-compose.prod.yml 强制要求环境变量
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-aicook_dev_admin}"
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-aicook_dev_only_jwt_secret}
    volumes:
      - uploads:/app/uploads       # 模块 D 识别图片落盘目录（backend/uploads）
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 前端：单镜像 nginx 同时托管 web-stage1(/) 与 admin-web(/admin) ----------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: aicook-web
    ports:
      # 默认 80；宿主机 80 被占用时可用环境变量覆盖（如 WEB_PORT=8080 docker compose up -d）
      - "${WEB_PORT:-80}:80"
    depends_on:
      # 等 api 通过容器 HEALTHCHECK 后再启动 web，规避 nginx 启动期解析 upstream 的竞态
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ---------- redis：阶段二预留（后端当前进程内缓存，不强依赖） ----------
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: aicook-redis
    restart: unless-stopped

networks:
  default:
    name: aicook-net

volumes:
  pgdata:
  uploads:
